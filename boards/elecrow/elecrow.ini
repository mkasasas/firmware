[env:elecrow-advance-35-s3]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/elecrow_advance_s3>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DFP=1
	-flto
build_flags =
	${env.build_flags}
	-Iboards/elecrow_advance_s3
	-Os
	-mlongcalls
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-UFP
	-Wl,--gc-sections
	-Wl,--allow-multiple-definition

	-DELECROW

	; Speaker I2S (پین‌ها تغییر کرد تا با پین‌های 11,12,13 تاچ تداخل نکنه!)
	-DBCLK=19
	-DWCLK=20
	-DDOUT=21

	; Microphone I2S
	-DPIN_CLK=9
	-DI2S_SCLK_PIN=9
	-DPIN_DATA=10
	-DI2S_DATA_PIN=10

	; No RGB LED
	-DRGB_LED=-1

	; BadUSB on UART pins
	-DBAD_TX=17
	-DBAD_RX=18

	; Serial/GPS
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	; IR/RF free pins
	-DIR_TX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DIR_RX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DRF_TX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DRF_RX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'

	; Font sizes
	-DFM=2
	-DFG=3

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=38
	-DMINBRIGHT=10

	; TFT_eSPI - SPI display (ILI9488, 480x320)
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DILI9488_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MOSI=39
	-DTFT_MISO=-1
	-DTFT_SCLK=42
	-DTFT_CS=40
	-DTFT_DC=41
	-DTFT_RST=-1
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Touch Resistive (XPT2046: T_CS=46, T_IRQ=3, T_DIN/MOSI=11, T_OUT/MISO=13, T_CLK=12)
	-DHAS_TOUCH=1
	-DTOUCH_CS=46
	-DTOUCH_IRQ=3
	-DTOUCH_MOSI=11
	-DTOUCH_MISO=13
	-DTOUCH_CLK=12
	-DTOUCH_OFFSET_ROTATION=1

	; SD Card SPI
	-DSDCARD_CS=7
	-DSDCARD_SCK=5
	-DSDCARD_MISO=4
	-DSDCARD_MOSI=6

	; SPI bus pin aliases (required by utils.cpp & RFID2.h)
	-DSPI_SCK_PIN=5
	-DSPI_MOSI_PIN=6
	-DSPI_MISO_PIN=4
	-DSPI_SS_PIN=7

	; Backlight PWM
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_BITS=8
	-DTFT_BRIGHT_FREQ=5000

	-DDEVICE_NAME='"Elecrow Advance 3.5 S3"'

lib_deps =
	${env.lib_deps}
	lewisxhe/SensorLib @ 0.3.4
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	fastled/FastLED @ 3.7.8
