[env:smoochiee-board]
board = esp32-s3-devkitc-1
board_build.partitions = custom_8Mb.csv

build_src_filter =
    ${env.build_src_filter}
    +<../boards/smoochiee_board>

build_flags =
    ${env.build_flags}
    -Iboards/smoochiee_board
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=39
    -DTFT_SCLK=42
    -DTFT_CS=45
    -DTFT_DC=41
    -DTFT_RST=-1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DHAS_TOUCH=1
    -DTFT_SPI_MODE=SPI_MODE0
    -DTOUCH_CS=46
    -DTOUCH_IRQ=3
    -DTOUCH_SCLK=42
    -DTOUCH_MOSI=39
    -DTOUCH_MISO=4
    -DBRUCE_TOUCH_ROTATION=3

lib_deps =
    ${env.lib_deps}
