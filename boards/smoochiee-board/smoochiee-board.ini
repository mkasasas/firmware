[env:smoochiee-board]
extends = env:esp32-s3
board = esp32-s3-devkitc-1
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_opi

build_src_filter =
    ${env:esp32-s3.build_src_filter}
    +<../boards/smoochiee_board>

build_flags =
    ${env:esp32-s3.build_flags}
    -Iboards/smoochiee_board
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDEVICE_NAME='"Mohammad S3 Touch"'
    -DLIS3DH_INT_PIN=-1
    -DBK_BTN=-1
    -DSEL_BTN=0
    -DUP_BTN=-1
    -DDW_BTN=-1
    -DL_BTN=-1
    -DR_BTN=-1
    -DAllowAllRM=1
    -DRotateScreen=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=39
    -DTFT_SCLK=42
    -DTFT_CS=45
    -DTFT_DC=41
    -DTFT_RST=-1
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_MISO=4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DHAS_TOUCH=1
    -DTFT_SPI_MODE=SPI_MODE0
    -DTOUCH_CS=46
    -DTOUCH_IRQ=3
    -DTOUCH_SCLK=42
    -DTOUCH_MOSI=39
    -DTOUCH_MISO=4
    -DBRUCE_TOUCH_ROTATION=3
    -DSDCARD_CS=-1
    -DSDCARD_MISO=4
    -DSDCARD_MOSI=39
    -DSDCARD_SCK=42
    -D CC1101_GDO0_PIN=-1
    -D CC1101_SS_PIN=-1
    -D CC1101_MOSI_PIN=39
    -D CC1101_SCK_PIN=42
    -D CC1101_MISO_PIN=4
    -D NRF24_CE_PIN=-1
    -D NRF24_SS_PIN=-1
    -D NRF24_MOSI_PIN=39
    -D NRF24_SCK_PIN=42
    -D NRF24_MISO_PIN=4
    -DBCLK=16
    -DWCLK=18
    -DDOUT=17
    -DMCLK=-1
    -DRXLED=1
    -DTXLED=2
    -DPIN_CLK=40
    -DPIN_DATA=2

lib_deps =
    ${env:esp32-s3.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
