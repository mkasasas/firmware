[env:elecrow-advance-35-s3]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/elecrow_advance_s3>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DFP=1
    -flto    ; این رو اضافه کردم که قابلیتِ بهینه‌سازیِ خطرناکِ لینکِر رو خاموش کنه
build_flags =
	${env.build_flags}
	-Iboards/elecrow_advance_s3
	-Os
    -mlongcalls ; این همون جادوییه که ارورِ ۱ گیگابایت رو می‌کشه!
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-UFP
	-Wl,--gc-sections
	-Wl,--allow-multiple-definition

	-DELECROW

	; (بقیه تنظیماتِ پین‌ها رو دقیقاً همونطوری که بود نگه دار...)
    ; ...
    ; ... (اینجا همون تنظیمات پینِ قبلی که داشتی رو بذار)
    ; ...
	-DDEVICE_NAME='"Elecrow Advance 3.5 S3"'

lib_deps =
	${env.lib_deps}
	lewisxhe/SensorLib @ 0.3.4
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
	fastled/FastLED @ 3.7.8
