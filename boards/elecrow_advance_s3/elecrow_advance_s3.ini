[env:elecrow-advance-35-s3]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee_board>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/smoochiee_board
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS


	; Speaker I2S
	-DBCLK=13
	-DWCLK=11
	-DDOUT=12

	; Microphone I2S
	-DPIN_CLK=9
	-DI2S_SCLK_PIN=9
	-DPIN_DATA=10
	-DI2S_DATA_PIN=10

	; No RGB LED
	-DRGB_LED=-1

	; BadUSB on UART pins
	-DBAD_TX=17
	-DBAD_RX=18

	; Serial/GPS
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0
	-DSEL_BTN=0
	-DUP_BTN=-1
	-DDW_BTN=-1

	; IR/RF free pins
	-DIR_TX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DIR_RX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DRF_TX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'
	-DRF_RX_PINS='{{"Pin 17", 17}, {"Pin 18", 18}}'

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=38
	-DMINBRIGHT=10

	; TFT_eSPI - SPI display (ILI9488, 480x320)
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DILI9488_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DTFT_MOSI=39
	-DTFT_MISO=4
	-DTFT_SCLK=42
	-DTFT_CS=45
	-DTFT_DC=41
	-DTFT_RST=-1
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=16000000

	; Touch XPT2046 Resistive SPI
	-DHAS_TOUCH=1
	-DTOUCH_CS=46
	-DTOUCH_IRQ=3
	-DTOUCH_MOSI=39
	-DTOUCH_MISO=4
	-DTOUCH_CLK=42
	-DTOUCH_OFFSET_ROTATION=1
	-DSPI_TOUCH_FREQUENCY=2500000

	; SD Card SPI (Moved to unused pins so pin 4 doesn't conflict)
	-DSDCARD_CS=7
	-DSDCARD_SCK=5
	-DSDCARD_MISO=15
	-DSDCARD_MOSI=6

	; SPI bus pin aliases
	-DSPI_SCK_PIN=5
	-DSPI_MOSI_PIN=6
	-DSPI_MISO_PIN=15
	-DSPI_SS_PIN=7

	; Backlight PWM
	-DTFT_BRIGHT_CHANNEL=0
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=5000

	-DDEVICE_NAME='"Mohammad S3 Touch"'

lib_deps =
	${env.lib_deps}
